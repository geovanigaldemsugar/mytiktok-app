<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mytiktok</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            font-family: Arial, sans-serif !important;
        }
        
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlInput = document.getElementById('url');
            const submitButton = document.getElementById('submit-button');
            const successMessage = document.getElementById('success-message');
            const downloadFailed = document.getElementById('error-message');
            const invalidUrl = document.getElementById('error-message-invalid-url');
            const thumbnailContainer = document.getElementById('thumbnail-container');
            const thumbnailImage = document.getElementById('thumbnail-image');
            const thumbnailTitle = document.getElementById('thumbnail-title');
            const thumbnailAuthor = document.getElementById('thumbnail-author');
            const form = document.getElementById('url-form');
            const progressBar = document.getElementById('progress-bar');
            const buttonColor = 'bg-rose-500';
            const buttonColorHover = 'hover:bg-rose-600';
            const buttonColorDisabled = 'bg-neutral-800';

            function updateButton(state, text) {
                const buttonText = document.getElementById('button-text');
                submitButton.disabled = state;
                buttonText.textContent = text;
                if (state) {
                    submitButton.classList.remove(buttonColor, buttonColorHover);
                    submitButton.classList.add(buttonColorDisabled);
                } else {
                    submitButton.classList.remove(buttonColorDisabled);
                    submitButton.classList.add(buttonColor, buttonColorHover);
                }
            }

            function resetMessages() {
                successMessage.classList.add('hidden');
                downloadFailed.classList.add('hidden');
                invalidUrl.classList.add('hidden');
            }

            function updateProgress(percent) {
                document.getElementById('progress-bar').style.width = `${percent}%`;
                updateButton(true, `Downloading... ${percent}%`);
            }

            async function downloadWithProgress(downloadUrl) {
                progressBar.classList.remove('hidden');
                updateProgress(0);

                const response = await fetch(downloadUrl);
                if (!response.ok) throw new Error('Download Failed');

                const total = parseInt(response.headers.get('Content-Length') || '0');
                const reader = response.body.getReader();
                let received = 0;
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    if (total) {
                        updateProgress(Math.round((received / total) * 100));
                    }
                }

                // Merge all chunks
                const blob = new Blob(chunks);
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = downloadUrl.split('/').pop();
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            }
            updateButton(false, 'Download');
            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                const url = urlInput.value.trim();
                if (!url) return;

                updateButton(true, 'Downloading...');
                resetMessages();

                try {
                    const infoResponse = await fetch('/info', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ url })
                    });
                    const infoData = await infoResponse.json();

                    if (!infoData.success) throw new Error(infoData.message);

                    thumbnailImage.src = infoData.thumbnail_url;
                    thumbnailTitle.textContent = infoData.title;
                    thumbnailAuthor.textContent = `@${infoData.author}`;
                    thumbnailContainer.classList.remove('hidden');

                    // Step 2: Ask server to download video
                    const downloadResponse = await fetch('/download');
                    const downloadData = await downloadResponse.json();
                    if (!downloadData.success) throw new Error(downloadData.message);

                    // Step 3: Stream the video with progress
                    await downloadWithProgress(`/videos/${infoData.file_name}`);
                    successMessage.classList.remove('hidden');

                } catch (error) {
                    console.error(error);
                    if (error.message === 'Url Invalid') {
                        invalidUrl.classList.remove('hidden');

                    } else if (error.message === 'Download Failed') {
                        downloadFailed.classList.remove('hidden');
                    }
                } finally {
                    updateButton(false, 'Download');
                    progressBar.classList.add('hidden');
                }
            });
        });
    </script>
</head>

<body class="bg-neutral-950 flex items-center justify-center h-screen font-sans">
    <div class="bg-neutral-900 p-8 rounded-lg shadow-md w-full max-w-lg">
        <h1 class="text-2xl font-bold text-white text-center mb-6">TikTok Downloader</h1>

        <form id="url-form" method="POST">
            <div class="mb-4 bg-neutral-800 rounded-lg">
                <input type="url" id="url" name="url" placeholder="Enter Tiktok Video URL"
                    class="w-full p-3 border-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 text-stone-100"
                    required>
            </div>

            <button id="submit-button" type="submit"
                class="relative w-full text-stone-100 p-3 rounded-lg transition duration-300 overflow-hidden">

                <div id="progress-bar" class="absolute left-0 top-0 h-full bg-rose-500 transition-all duration-300"
                    style="width: 0%"></div>
                <span id="button-text" class="relative z-10">Download</span>
            </button>

            <!-- <button id="submit-button" type="submit"
                class="w-full bg-gray-700 text-white p-3 rounded-lg cursor-not-allowed transition duration-300"
                disabled>Download
            </button>

            <div id="progress-container" class=" hidden w-full bg-gray-700 rounded-lg h-6 dark:bg-gray-700 mt-4">
                <div id="progress-bar" class="bg-blue-600 h-6 rounded-lg" style="width: 0%"></div>
            </div> -->

            <div id="success-message" class="hidden mt-4 text-green-500 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span class="ml-2">Downloaded Successfully</span>

            </div>
            <div id="error-message" class="hidden mt-4 text-red-500 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span class="ml-2">Download Failed</span>
            </div>
            <div id="error-message-invalid-url" class="hidden mt-4 text-red-500 text-center">
                <!-- <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg> -->
                <span class="ml-2">Url Invalid</span>
            </div>
        </form>
        <div id="thumbnail-container" class="hidden bg-gray-1 rounded-lg mt-4 flex items-center justify-center">

            <div class="w-24 h-24 mr-4 shadow-md flex-shrink-0">
                <img id="thumbnail-image"
                    src="https://p16-sign.tiktokcdn-us.com/obj/tos-useast5-p-0068-tx/012df75b3bce4f01b30fd4d1c6e547ae?x-expires=1716858000&x-signature=MfwjIZIvbOA40Q9LQJwaKThlxGQ%3D"
                    alt="Thumbnail" class="w-full h-full object-cover rounded-lg">
            </div>
            <div>
                <p id="thumbnail-title" class="text-md text-stone-100 font-semibold mb-2">Sample Title</p>
                <h2 id="thumbnail-author" class="text-sm text-gray-400 font-bold">Author Name</h2>
            </div>
        </div>

    </div>
</body>

</html>
